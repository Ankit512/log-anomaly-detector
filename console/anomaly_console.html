<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anomaly Console — itsoc</title>
<style>
/* ==========================================================================
   Nocturne tokens — the subset this screen uses, copied from the design
   system's styles.css. Values are verbatim; the ramps this console never
   touches are omitted rather than restated.
   ========================================================================== */
:root{
  --color-bg:#161826;
  --color-surface:#232532;
  --color-text:#e9e9ed;
  --color-accent:#9184d9;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);

  --color-neutral-200:#e4e7f5;
  --color-neutral-400:#b2b6ca;
  --color-neutral-500:#9397ab;
  --color-neutral-600:#75798c;
  --color-neutral-700:#595d6c;
  --color-neutral-800:#3f424d;

  --color-accent-300:#d2cefd;
  --color-accent-400:#b5abfc;
  --color-accent-500:#968ae0;
  --color-accent-600:#796cbf;
  --color-accent-900:#2b2741;

  --font-heading:"Inter",system-ui,-apple-system,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,Menlo,Monaco,"Cascadia Code",monospace;

  --space-1:2.8px; --space-2:5.6px; --space-3:8.4px;
  --space-4:11.2px; --space-6:16.8px; --space-8:22.4px;

  --radius-sm:4px; --radius-md:8px; --radius-lg:14px;
  --shadow-sm:0 0 0 1px #3f424d;

  /* Severity ramp — monotonic and deliberately GREEN-FREE. Green reads as "safe"
     in a security UI, so nothing on this scale may drift toward it: the ramp runs
     red -> orange -> gold -> slate -> grey, with hue falling 1° -> 34° -> 44° and
     then leaving the warm range entirely for the two non-alarming steps.
     MEDIUM was #c9c07a (hue 53°, sat 42%) which rendered olive/lime. */
  --sev-critical:#e2807f;   /* hue   1° · contrast 6.4:1 */
  --sev-high:#d8a35e;       /* hue  34° · contrast 7.8:1 */
  --sev-medium:#dcb64a;     /* hue  44° · contrast 9.1:1 — gold, not lime */
  --sev-low:#9397ab;        /* neutral slate · contrast 6.1:1 */
  --sev-none:#75798c;       /* grey · contrast 4.1:1 */
  --ok:#8ecf9a;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;
}
h3,h5{font-family:var(--font-heading);font-weight:500;line-height:1.12;letter-spacing:-0.015em;margin:0}
a{color:var(--color-accent);text-decoration:none}
a:hover{color:var(--color-accent-400)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
@keyframes locpulse{0%,100%{opacity:.35}50%{opacity:1}}

/* — buttons, verbatim from the design system — */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;text-decoration:none;
  font-family:var(--font-heading);font-weight:500;font-size:14px;line-height:1.2;
  color:var(--color-text);background:transparent;border:1px solid transparent;
  padding:var(--space-2) calc(var(--space-3)*1.2);border-radius:var(--radius-md);
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
.btn-primary:active{background:color-mix(in srgb,var(--color-accent) 22%,transparent)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}

/* — form controls — */
.input{
  width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);
  background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:var(--radius-md);
}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt:has(input:checked){color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.seg-opt:not(:has(input:checked)):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.seg-opt:has(input:focus-visible){outline:2px solid var(--color-accent);outline-offset:-2px}

/* ==========================================================================
   Console layout
   ========================================================================== */
.app{height:100vh;min-height:820px;display:flex;flex-direction:column;overflow:hidden}

.hdr{display:flex;align-items:center;gap:var(--space-6);padding:var(--space-4) var(--space-6);flex:none}
.brand{display:flex;align-items:baseline;gap:var(--space-3);margin-right:auto}
.brand b{font-size:18px;font-weight:500;letter-spacing:-0.015em}
.brand span{font-size:11px;color:var(--color-neutral-600)}
.pill{display:flex;align-items:center;gap:var(--space-2);padding:4px 10px;border-radius:var(--radius-md)}
.pill-accent{border:1px solid var(--color-accent);color:var(--color-accent)}
.pill-accent b{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.pill-accent span{font-size:11px;letter-spacing:.02em}
.pill-local{gap:7px;border:1px solid rgba(233,233,237,.16)}
.pill-local span{font-size:11px;color:var(--color-neutral-400)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:locpulse 2.4s ease-in-out infinite}

/* Freestanding rules fade at both ends — the Nocturne signature, here as
   top+bottom edges on the run bar. */
.runbar{
  display:flex;align-items:center;gap:var(--space-6);padding:var(--space-3) var(--space-6);flex:none;
  background:
    linear-gradient(to right,transparent,rgba(233,233,237,.16) 48px,rgba(233,233,237,.16) calc(100% - 48px),transparent) no-repeat bottom/100% 1px,
    linear-gradient(to right,transparent,rgba(233,233,237,.16) 48px,rgba(233,233,237,.16) calc(100% - 48px),transparent) no-repeat top/100% 1px;
}
.runmeta{display:flex;align-items:center;gap:var(--space-4);font-size:12px;color:var(--color-neutral-400);font-variant-numeric:tabular-nums}
.runmeta b{color:var(--color-text);font-weight:500}
.sep{color:var(--color-neutral-700)}
.runacts{display:flex;gap:var(--space-2);margin-left:auto}

.manifest{
  padding:var(--space-4) var(--space-6);background:#1c1f30;display:flex;gap:var(--space-8);
  flex-wrap:wrap;font-size:11.5px;font-family:var(--font-mono);color:var(--color-neutral-400);
  flex:none;box-shadow:inset 0 -1px 0 rgba(233,233,237,.10);
}
.manifest k{color:var(--color-neutral-600)}

.warn{
  display:flex;align-items:flex-start;gap:var(--space-4);margin:var(--space-4) var(--space-6) 0;
  padding:var(--space-4);border:1px solid #7a6a3c;border-radius:var(--radius-md);
  background:rgba(122,106,60,.14);flex:none;
}
.warn-bar{width:6px;align-self:stretch;border-radius:3px;background:#d8b45e;flex:none}
.warn-t{font-size:13px;font-weight:500;margin-bottom:var(--space-1)}
.warn-b{font-size:12px;color:var(--color-neutral-400);max-width:760px}

.body{flex:1;display:flex;min-height:0}

/* — left: finding list — */
.list-pane{width:520px;flex:none;display:flex;flex-direction:column;min-height:0;box-shadow:inset -1px 0 0 rgba(233,233,237,.10)}
.filters{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-4) var(--space-6) var(--space-3);flex-wrap:wrap;flex:none}
.chip{padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:11.5px}
.hint{margin-left:auto;font-size:10.5px;font-family:var(--font-mono);color:var(--color-neutral-600)}
.bulk{display:flex;align-items:center;gap:var(--space-3);margin:0 var(--space-6) var(--space-3);padding:7px var(--space-4);border-radius:var(--radius-md);background:var(--color-accent-900);flex:none}
.bulk span{font-size:12px}
.bulk div{display:flex;gap:var(--space-2);margin-left:auto}
.rows{flex:1;overflow:auto;padding:0 var(--space-6) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3)}

.row{display:flex;gap:var(--space-4);padding:var(--space-4);border-radius:var(--radius-md);cursor:pointer}
.row-rail{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);flex:none;padding-top:2px}
.row-rail input{width:14px;height:14px;accent-color:var(--color-accent-500);cursor:pointer}
.row-sev{width:4px;flex:1;border-radius:2px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-2)}
.row-head{display:flex;align-items:center;gap:var(--space-3)}
.sev-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.prov{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.stamp{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--color-neutral-600)}
.row-title{font-size:13.5px;line-height:1.35;text-wrap:pretty}
.row-meta{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--font-mono);color:var(--color-neutral-500)}

/* Rule-vs-model comparison strip — the heart of the screen. */
.cmp{display:flex;align-items:stretch;margin-top:var(--space-1);border:1px solid rgba(233,233,237,.12);border-radius:6px;overflow:hidden}
.cmp-cell{flex:1;padding:var(--space-2) var(--space-3)}
.cmp-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:2px}
.cmp-v{font-size:12px}
.cmp-div{width:1px;background:rgba(233,233,237,.12)}
.cmp-delta{display:flex;align-items:center;padding:0 var(--space-3)}
.cmp-delta span{font-size:10px;letter-spacing:.04em}

.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-1)}
.tagm{font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--color-neutral-800);color:var(--color-neutral-200);font-family:var(--font-mono)}

.empty{margin-top:56px;text-align:center;padding:0 var(--space-8)}
.empty-mark{width:44px;height:44px;margin:0 auto var(--space-6);border-radius:50%;border:1px solid var(--color-neutral-800);display:flex;align-items:center;justify-content:center;color:var(--ok);font-size:18px}
.empty-t{font-size:17px;font-weight:500;margin-bottom:var(--space-2)}
.empty-b{font-size:12.5px;color:var(--color-neutral-500);max-width:340px;margin:0 auto;text-wrap:pretty}

/* — right: detail — */
.detail-pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.detail{flex:1;overflow:auto;padding:var(--space-6) var(--space-8) var(--space-8)}
.d-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.d-type{font-size:11px;font-family:var(--font-mono);color:var(--color-neutral-600)}
.d-title{margin:0 0 var(--space-4);font-size:23px;max-width:820px;text-wrap:pretty}
.verdicts{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
.vcard{flex:1;min-width:220px;padding:var(--space-4);border-radius:var(--radius-md)}
.vcard-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:var(--space-2)}
.vcard-v{font-size:19px;margin-bottom:4px}
.vcard-s{font-size:11.5px;color:var(--color-neutral-500)}
.panel{padding:var(--space-4) 12px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm)}
.panel-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:var(--space-2)}
.explain{margin-bottom:var(--space-6)}
.explain .panel-k{color:var(--color-accent)}
.explain p{margin:0;font-size:13.5px;line-height:1.6;color:var(--color-neutral-200);max-width:840px;text-wrap:pretty}

.ev-head{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)}
.ev-head h5{font-size:14px}
.ev-head span{font-size:11px;color:var(--color-neutral-600)}
.ev{border-radius:var(--radius-md);overflow:hidden;background:#12141f;box-shadow:inset 0 0 0 1px rgba(233,233,237,.10);margin-bottom:var(--space-6)}
.ev-row{display:flex;gap:var(--space-4);padding:var(--space-2) var(--space-4);font-family:var(--font-mono);font-size:11.5px;line-height:1.5}
.ev-n{color:var(--color-neutral-700);flex:none;width:44px;text-align:right}
.ev-t{color:var(--color-neutral-500);white-space:pre-wrap;word-break:break-word}
.ev-hit{color:var(--color-bg);padding:0 3px;border-radius:3px}

.split{display:flex;gap:var(--space-6);flex-wrap:wrap;margin-bottom:var(--space-6)}
.split>.panel{flex:1;min-width:320px}
.pred{font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--color-accent-300);white-space:pre-wrap}
.pred-ref{margin-top:var(--space-3);font-size:11px;color:var(--color-neutral-600);font-family:var(--font-mono)}
.tl{display:flex;gap:var(--space-4);align-items:flex-start}
.tl-t{font-family:var(--font-mono);font-size:11px;color:var(--color-neutral-500);flex:none;padding-top:2px}
.tl-rail{width:9px;flex:none;display:flex;flex-direction:column;align-items:center;align-self:stretch}
.tl-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.tl-line{width:1px;flex:1;background:rgba(233,233,237,.14)}
.tl-l{font-size:12.5px;padding-bottom:var(--space-3);color:var(--color-neutral-200);text-wrap:pretty}

.mark-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.mark-head .note{font-size:11px;color:var(--color-neutral-600)}
.mark-head .status{margin-left:auto;font-size:11.5px}
.mark-acts{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.mark-acts .input{width:auto;min-width:230px}

.nodetail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);padding:var(--space-8);text-align:center}
.nodetail-t{font-size:15px;color:var(--color-neutral-400)}
.nodetail-b{font-size:12.5px;color:var(--color-neutral-600);max-width:420px;text-wrap:pretty}

.ftr{display:flex;align-items:center;gap:var(--space-6);padding:var(--space-3) var(--space-6);flex:none;font-size:11px;font-family:var(--font-mono);color:var(--color-neutral-600);box-shadow:inset 0 1px 0 rgba(233,233,237,.10)}
.ftr .local{display:flex;align-items:center;gap:6px;color:var(--color-neutral-400)}
.ftr .local i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.ftr .ro{margin-left:auto}

/* — run navigation — */
.navbtn{position:relative}
.runs{position:absolute;top:calc(100% + 6px);right:0;z-index:20;width:420px;max-height:60vh;
  overflow:auto;padding:var(--space-2);border-radius:var(--radius-md);background:var(--color-surface);
  box-shadow:var(--shadow-md, 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,.55))}
.runs-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);
  padding:var(--space-2) var(--space-3)}
.run{display:flex;align-items:baseline;gap:var(--space-3);width:100%;padding:var(--space-2) var(--space-3);
  border:0;border-radius:6px;background:transparent;color:var(--color-text);cursor:pointer;
  font:inherit;text-align:left}
.run:hover{background:color-mix(in srgb,var(--color-text) 8%,transparent)}
.run[data-current="1"]{box-shadow:inset 0 0 0 1px var(--color-accent-600)}
.run b{font-size:12.5px;font-weight:500}
.run span{font-size:11px;color:var(--color-neutral-500);font-family:var(--font-mono)}
.run .when{margin-left:auto;font-size:10.5px;color:var(--color-neutral-600);font-family:var(--font-mono)}

/* ==========================================================================
   Log-source picker
   ========================================================================== */
.pick{flex:1;overflow:auto;padding:var(--space-8) var(--space-8) 56px;display:flex;
  flex-direction:column;align-items:center}
.pick-in{width:100%;max-width:760px}
.pick-h{font-size:23px;margin:0 0 var(--space-2)}
.pick-sub{font-size:13px;color:var(--color-neutral-500);margin:0 0 var(--space-8);text-wrap:pretty}
.src{padding:var(--space-6);border-radius:var(--radius-md);background:var(--color-surface);
  box-shadow:var(--shadow-sm);margin-bottom:var(--space-4)}
.src-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);
  margin-bottom:var(--space-2)}
.src-t{font-size:15px;font-weight:500;margin-bottom:var(--space-1)}
.src-note{font-size:11.5px;color:var(--color-neutral-500);margin-bottom:var(--space-4);text-wrap:pretty}
.src-row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.samp{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-md);border:1px solid var(--color-divider);background:transparent;
  color:var(--color-text);cursor:pointer;font:inherit;text-align:left}
.samp:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent);border-color:var(--color-accent)}
.samp b{font-size:13px;font-weight:500}
.samp span{font-size:11px;color:var(--color-neutral-500);font-family:var(--font-mono)}

/* The network source is visually separated on purpose: it is the only one that
   leaves this machine, and that should be obvious before it is clicked. */
.src-net{background:rgba(35,37,50,.5);box-shadow:inset 0 0 0 1px rgba(216,180,94,.30)}
.src-net .src-k{color:#d8b45e}
.chip-url{padding:4px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;font:inherit;font-size:11.5px;
  background:transparent;color:var(--color-neutral-400);border:1px solid var(--color-divider)}
.chip-url:hover{border-color:var(--color-accent);color:var(--color-accent)}

.pick-opt{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-6) 0 var(--space-2);
  font-size:13px;color:var(--color-neutral-400)}
.pick-opt input{width:15px;height:15px;accent-color:var(--color-accent-500);cursor:pointer}
.pick-err{margin-top:var(--space-4);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);
  border:1px solid #7a3c3c;background:rgba(122,60,60,.16);font-size:12.5px;color:#e2807f}
.busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);
  flex:1;padding:var(--space-8);text-align:center}
.busy-t{font-size:17px;font-weight:500}
.busy-b{font-size:12.5px;color:var(--color-neutral-500);max-width:460px;text-wrap:pretty}
.spinner{width:26px;height:26px;border-radius:50%;border:2px solid var(--color-neutral-800);
  border-top-color:var(--color-accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
"use strict";
/* ==========================================================================
   Anomaly Console — a read-only review surface for one analyzer run.

   The screen exists to make one thing visible: the deterministic rules own
   severity, and the local model only explains. Every finding shows the rule's
   verdict beside what the model alone would have said, so an under-rating is
   a fact on the page rather than a claim in a README.

   Vanilla JS on purpose. The design prototype was React-backed; this project
   is stdlib-only with no build step, and a review console that needs npm to
   open would not survive contact with the repo.
   ========================================================================== */

const SEV = {
  CRITICAL: "#e2807f", HIGH: "#d8a35e", MEDIUM: "#dcb64a", LOW: "#9397ab", NONE: "#75798c"
};

/* Fixture data, carried over from the design. Section 6 of the README notes
   what a real report.json does and does not yet supply for these fields. */
const FINDINGS = [
  {
    id: "f1", sev: "CRITICAL", ruleSev: "CRITICAL", llmSev: "MEDIUM", prov: "RULE-CAUGHT",
    type: "auth_bruteforce_success", host: "server-01", time: "02:16:52",
    stamp: "2026-08-13T02:16:52Z · server-01",
    title: "Brute-force then successful login for 'admin' from 203.0.113.44 — likely account compromise",
    ruleWhy: "Correlation rule fired across 8 lines.",
    llmWhy: "Read the success line in isolation; did not link it to the preceding failures.",
    explanation: "Seven password failures for the admin account arrived from a single external address in six seconds, and eight seconds after the last one the same address logged in successfully. That pattern is a credential-guessing attack that worked. Treat the admin account on server-01 as compromised from 02:16:52 onward and review everything that session did.",
    predicate: "failures_from(ip) >= 5\n  AND peak_within(120s) >= 5\n  AND auth_success(same ip) <= 120s after last failure\n→ severity = CRITICAL",

/* Fixture -> the same shape console/adapter.py emits, so render() only ever
   deals with one contract. `live:false` is what drives the demo-only affordances
   (the run-state switcher); a real run's state is derived, never switchable. */
function fixtureState() {
  return {
    live: false,
    runId: "auth-2026-08-13-0214", runWindow: "02:14–02:20 UTC · 13 Aug 2026",
    runHosts: "server-01/02/03 + firewall-01", runParsed: "2,000 lines parsed · 0 unparsed",
    manifest: {
      input_sha256: "8f2ca41d…(fixture)", detector_sha256: "43f0560f…(fixture)",
      model: "llama3.1:8b", temperature: 0, ruleset: "v1"
    },
    compareRun: true, underratedCount: FINDINGS.filter((f) => f.ruleSev !== f.llmSev
      && f.prov === "RULE-CAUGHT").length,
    chunksUsable: 20, chunksTotal: 20, degraded: false, analyzerErrors: 0,
    findings: FINDINGS.map((f, i) => ({
      ...f, id: f.id || "f" + i,
      sevColor: SEV[f.sev],
      hostDerived: true, occurrences: 1, linesNote: null,
      delta: f.prov !== "RULE-CAUGHT" ? "note-only"
        : f.ruleSev === f.llmSev ? "agree" : "under-rated",
      timeline: (f.timeline || []).map((t) => ({ ...t }))
    }))
  };
}

// Replaced at bootstrap by live data when a report is being served.
let DATA = fixtureState();

/* A standalone export inlines its run and has no server: every path that would
   call one (picker, upload, fetch, run history, on-demand explanation) must be
   absent rather than present-and-broken. */
const STANDALONE = typeof window !== "undefined" && window.STANDALONE === true;

const state = {
  // picker / analysis
  sources: null,         // {samples, suggestedUrls} from /api/sources
  runs: null, showRuns: false,   // saved-run navigation
  busy: false, busyLabel: "", busyCompare: false,
  compare: false, urlValue: "", error: null,
  // Where explanations compute. Local is the default and today's behaviour;
  // remote sends ONLY redacted finding-lines through the server's choke point.
  computeCfg: { mode: "local", baseUrl: "", apiKey: "", model: "" },

  view: "incident",      // demo-only: incident | partial | clear
  filter: "all",         // all | dis | llm | open
  selId: null,
  checked: [],
  marks: {},
  copied: false,
  manifest: false,
  reason: "Reason — expected admin activity"
};

const REASONS = [
  "Reason — expected admin activity",
  "Reason — known scanner / test traffic",
  "Reason — duplicate of an earlier finding",
  "Reason — threshold too sensitive here"
];

// --------------------------------------------------------------------------
// Selectors
// --------------------------------------------------------------------------
/* In live mode the run's contents are whatever the analyzer produced. The demo
   view switcher only applies to the fixture. */
const all = () => (!DATA.live && state.view === "clear" ? [] : DATA.findings);

/* A finding the rules rated above what the model alone would have. Sourced from
   the adapter's delta so the console never re-derives severity semantics. */
const underrated = (f) => f.delta === "under-rated";

/* Zero findings is an All-clear run; a degraded chunk is a Partial run. Both are
   properties of the data, not modes a viewer picks. */
const isClear = () => all().length === 0;
const isPartial = () => DATA.live
  ? (DATA.degraded || DATA.analyzerErrors > 0)
  : state.view === "partial";

function visible() {
  return all().filter((x) =>
    state.filter === "dis"  ? underrated(x) :
    state.filter === "llm"  ? x.prov === "LLM-SURFACED" :
    state.filter === "open" ? !state.marks[x.id] : true);
}

const current = () => {
  const list = visible();
  return list.find((f) => f.id === state.selId) || list[0] || null;
};

function chipStyle(active) {
  return active
    ? { bg: "rgba(150,138,224,.18)", fg: "#d2cefd", bd: "#796cbf" }
    : { bg: "transparent", fg: "#9397ab", bd: "rgba(233,233,237,.16)" };
}

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

// --------------------------------------------------------------------------
// Render
// --------------------------------------------------------------------------
/* The app has three screens: pick a log, wait for it, review it. */
const isIdle = () => DATA.idle === true;

function render() {
  if (state.busy) return renderBusy();
  if (isIdle()) return renderPicker();

  const list = visible();
  const cur = current();
  const disagree = all().filter(underrated);

  document.getElementById("app").innerHTML = [
    header(disagree.length),
    runBar(),
    STANDALONE ? standaloneBanner() : "",
    (DATA.compute && DATA.compute.remote) ? computeBanner() : "",
    state.manifest ? manifestStrip() : "",
    // Independent of finding count. Gating this on an empty list was the bug: a run
    // that parsed nothing but still listed model output read as coverage it never had.
    (isUnrecognized() || isEmptyInput()) ? unrecognizedBanner() : "",
    isPartial() ? partialWarning() : "",
    `<div class="body">${listPane(list, cur, disagree.length)}${detailPane(cur)}</div>`,
    footer()
  ].join("");
}

function pickerHeader() {
  return `
  <header class="hdr">
    <div class="brand"><b>itsoc</b><span>local log anomaly review</span></div>
    <div class="pill pill-local">
      <span class="dot-live"></span><span>processed locally · 0 bytes leave this machine</span>
    </div>
  </header>`;
}

const PHASE_TEXT = {
  starting: "starting", reading: "reading the log", rules: "running the rules",
  explain: "explaining findings", compare: "comparing against the model alone",
  done: "finishing",
};

function renderBusy() {
  const p = state.progress || {};
  const pct = p.total ? Math.round((p.done / p.total) * 100) : null;
  const eta = p.etaSeconds != null && p.etaSeconds > 0
    ? (p.etaSeconds >= 90 ? `~${Math.round(p.etaSeconds / 60)} min left`
                          : `~${p.etaSeconds}s left`)
    : "";

  // The counts are the point: a bare spinner cannot be told apart from a hang.
  const detail = p.total
    ? `${esc(PHASE_TEXT[p.phase] || p.phase || "working")} — chunk ${p.done} of ${p.total}`
      + (eta ? ` · ${eta}` : "")
    : esc(PHASE_TEXT[p.phase] || "starting");

  const scope = (p.chunks && p.total && p.gapFill === false)
    ? `<div class="busy-b">Rules already read all ${p.chunks.toLocaleString()} chunk(s).
        The model only sees the ${p.total} that contain a finding — cost scales with findings,
        not file size.</div>`
    : "";

  document.getElementById("app").innerHTML = `
  ${pickerHeader()}
  <div class="busy">
    <div class="spinner"></div>
    <div class="busy-t">Analyzing ${esc(state.busyLabel || "the log")}…</div>
    <div class="busy-b" style="font-family:var(--font-mono);font-size:12px;color:var(--color-text)">
      ${detail}${pct != null ? ` · ${pct}%` : ""}
      ${p.findings ? ` · ${p.findings} rule finding(s) already` : ""}
    </div>
    ${scope}
    <div class="busy-b">${state.computeCfg && state.computeCfg.mode === "remote"
      ? "Rules run over every line on this machine; nothing is sent during analysis. "
        + "Explanations are produced on demand through the redaction gate."
      : `Rules run over every line first, then the local model explains what
      they found${state.busyCompare ? ", and a second unprimed pass records what the model would "
      + "have rated each finding on its own" : ""}. The model runs on this machine.`}</div>
  </div>`;
}

  document.getElementById("app").innerHTML = `
  ${pickerHeader()}
  <div class="pick"><div class="pick-in">
    <h3 class="pick-h">Choose a log to analyze</h3>
    <p class="pick-sub">Deterministic rules decide severity; the local model explains what they

    <div class="src">

    </div>

    <div class="src">
      <div class="src-k">Your machine</div>

      <div class="src-note">Read locally — your log never leaves this machine. It is copied to a
        temporary file, analyzed, and discarded when the console stops.</div>
      <div class="src-row">
        <input type="file" id="fileInput" class="input" style="width:auto;min-width:280px">
        <button class="btn btn-primary" data-act="upload">Analyze file</button>
      </div>
    </div>

    <div class="src src-net">
      <div class="src-k">Network · public test data only</div>
      <div class="src-t">Fetch a log from a URL</div>
      <div class="src-note">This is the one source that uses the network: it <strong>downloads</strong>
        public test data to this machine. Your own logs are never uploaded, and the analysis still

      <div class="src-row" style="margin-bottom:var(--space-3)">
        <input type="text" id="urlInput" class="input" style="flex:1;min-width:320px"
               placeholder="https://raw.githubusercontent.com/logpai/loghub/…/OpenSSH_2k.log"
               value="${esc(state.urlValue || "")}">
        <button class="btn btn-secondary" data-act="fetch">Fetch &amp; analyze</button>
      </div>
      <div class="src-row">${chips}</div>
    </div>

    <div class="src">

      <div class="src-note">Rules decide severity and correlation on this machine either way,

      <label class="pick-opt" style="margin:0 0 var(--space-2)">

    </label>

    ${state.error ? `<div class="pick-err">${esc(state.error)}</div>` : ""}

    ${(state.runs && state.runs.length) ? `

        not cost you another analysis.</div>

    </div>` : ""}
  </div></div>`;
}

/* The standing guarantee, kept honest when a remote compute node is enabled:
   verdicts still never leave this machine; only redacted finding-lines do. */
const localPillText = () => (DATA.compute && DATA.compute.remote)
  ? "verdicts computed locally · only redacted finding-lines leave"
  : "processed locally · 0 bytes leave this machine";

function header(underratedCount) {
  const seg = (val, label) =>
    `<label class="seg-opt"><input type="radio" name="runview" data-view="${val}"
      ${state.view === val ? "checked" : ""}><span>${label}</span></label>`;

  /* Without a compare run there is no honest number to show here. An unrun
     ablation is not "0 under-rated" — the pill says so rather than implying
     the model agreed with every rule. */
  const comparePill = DATA.compareRun
    ? `<div class="pill pill-accent">
         <b>${underratedCount}</b><span>findings a raw LLM would have under-rated</span>
       </div>`
    : `<div class="pill" style="border:1px solid rgba(233,233,237,.16);color:var(--color-neutral-500)">
         <span style="font-size:11px">compare not run — rerun with <code>--compare</code>
         to measure what the model alone would have rated these</span>
       </div>`;

  return `
  <header class="hdr">
    <div class="brand"><b>itsoc</b><span>local log anomaly review</span></div>
    ${comparePill}
    <div class="pill pill-local">
      <span class="dot-live"></span><span>${localPillText()}</span>
    </div>
    ${DATA.live ? "" : `<div class="seg" style="margin-left:4px">
      ${seg("incident", "Incident run")}${seg("partial", "Partial")}${seg("clear", "All clear")}
    </div>`}
  </header>`;
}

function runBar() {
  return `
  <div class="runbar">
    <div class="runmeta">
      <b>${esc(DATA.runId)}</b>
      ${DATA.runWindow ? `<span class="sep">·</span><span>${esc(DATA.runWindow)}</span>` : ""}
      <span class="sep">·</span><span>${esc(DATA.runHosts)}</span>
      <span class="sep">·</span><span>${esc(DATA.runParsed)}</span>
      ${DATA.live && DATA.modelFindings === 0 && DATA.analyzerErrors > 0 ? `
      <span class="sep">·</span><span style="color:#d8b45e">the model contributed no findings
        (${DATA.analyzerErrors} chunk(s) not analyzed)</span>` : ""}
    </div>
    <div class="runacts">
      ${DATA.live && !STANDALONE ? `<span class="navbtn">
        <button class="btn btn-secondary" data-act="runs">Runs${
          state.runs && state.runs.length ? ` (${state.runs.length})` : ""}</button>
        ${state.showRuns ? runsPanel() : ""}

      ${DATA.live && !STANDALONE ? `<button class="btn btn-secondary" data-act="new">New analysis</button>` : ""}
      ${DATA.live && !STANDALONE ? `<button class="btn btn-secondary" data-act="download">Download standalone</button>` : ""}
      <button class="btn btn-secondary" data-act="print">Print report</button>
      <button class="btn btn-primary" data-act="manifest">Run manifest · integrity</button>

}

/* Honest surface for remote compute: names the host explanations run on and
   the number of redacted finding-lines that have ACTUALLY been sent — the
   count comes from the server's choke point, never from a guess. The raw log
   never travels. */
function computeBanner() {
  const c = DATA.compute || {};
  return `
  <div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-6);
    background:rgba(216,163,94,.10);box-shadow:inset 0 -1px 0 rgba(216,163,94,.30);flex:none;
    font-size:11.5px;color:var(--color-neutral-400)">
    <span style="color:#d8a35e;font-weight:500">Remote compute</span>
    <span>${esc(c.banner || "")}</span>
  </div>`;
}

/* Integrity, not provenance. Every value here is recomputable from files on
   disk with sha256sum; nothing signs the run, so no "signed" or "signature
   valid" claim appears — that would assert an attestation nobody made. */
function standaloneBanner() {
  const when = (DATA.generatedAt || "").slice(0, 16).replace("T", " ");
  return `
  <div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-6);
    background:rgba(145,132,217,.10);box-shadow:inset 0 -1px 0 rgba(145,132,217,.30);flex:none;
    font-size:11.5px;color:var(--color-neutral-400)">
    <span style="color:var(--color-accent);font-weight:500">Static export</span>
    <span>of a run generated on ${esc(when)} — open anywhere, no install.</span>
    <span style="margin-left:auto;font-family:var(--font-mono);color:var(--color-neutral-600)">
      read-only · no network calls</span>
  </div>`;
}

function manifestStrip() {
  const m = DATA.manifest || {};
  const short = (h) => (h ? String(h).slice(0, 16) + "…" : "unavailable");
  return `
  <div class="manifest">
    <span><k>sha256(input)</k> ${esc(short(m.input_sha256))}</span>
    <span><k>sha256(detector)</k> ${esc(short(m.detector_sha256))}</span>
    <span><k>ruleset</k> ${esc(m.ruleset || "—")}</span>
    <span><k>model</k> ${esc(m.model || "—")} · temp ${esc(String(m.temperature ?? "—"))}</span>
    <span><k>generated</k> ${esc((DATA.generatedAt || "").slice(0, 19) || "—")}</span>
    <span style="color:var(--color-neutral-500)">integrity hashes — recomputable, not a signature</span>
  </div>`;
}

function partialWarning() {
  if (!DATA.live) {
    return warnBox("Chunk 14 of 20 was not analyzed by the model",
      "The model returned off-schema output for lines 1301–1400 and the section was skipped. " +
      "Deterministic rules still ran across every line, so severities below remain complete — " +
      "only the plain-language explanations are missing for that range.");
  }
  const missing = (DATA.chunksTotal || 0) - (DATA.chunksUsable || 0);
  const bits = [];
  if (DATA.analyzerErrors) {
    bits.push(`${DATA.analyzerErrors} chunk(s) were not analyzed by the model (off-schema output).`);
  }
  if (missing > 0) {
    bits.push(`${missing} of ${DATA.chunksTotal} chunk(s) returned no usable answer in the ` +
              `compare pass, so their findings show UNKNOWN rather than a severity — the ` +
              `model was never able to rate those lines, which is not the same as missing them.`);
  }
  return warnBox("This run is partial",
    bits.join(" ") + " Deterministic rules still ran across every line, so the severities below are complete.");
}

function warnBox(title, body) {
  return `
  <div class="warn">
    <span class="warn-bar"></span>
    <div>
      <div class="warn-t">${esc(title)}</div>
      <div class="warn-b">${esc(body)}</div>
    </div>
  </div>`;
}

function listPane(list, cur, disagreeCount) {
  const f = (key, label, count) => {
    const s = chipStyle(state.filter === key);
    return `<button class="chip" data-filter="${key}"
      style="background:${s.bg};color:${s.fg};border:1px solid ${s.bd}">${label} ${count}</button>`;
  };

  const bulk = state.checked.length
    ? `<div class="bulk">
         <span>${state.checked.length} selected</span>
         <div>
           <button class="btn btn-primary" data-act="bulk-confirm">Mark true positive</button>
           <button class="btn btn-secondary" data-act="bulk-clear">Clear</button>
         </div>
       </div>`
    : "";

  const rows = list.length
    ? list.map((x) => row(x, cur)).join("")
    : emptyList();

  return `
  <section class="list-pane">
    <div class="filters">
      ${f("all", "All", all().length)}
      ${f("dis", "Rule ≠ LLM", disagreeCount)}
      ${f("llm", "LLM-surfaced", all().filter((x) => x.prov === "LLM-SURFACED").length)}
      ${f("open", "Unreviewed", all().filter((x) => !state.marks[x.id]).length)}
      <span class="hint">j / k move · x select · e explain</span>
    </div>
    ${bulk}
    <div class="rows">${rows}</div>
  </section>`;
}

function row(f, cur) {
  const on = cur && f.id === cur.id;
  const dis = underrated(f);
  const llmSurfaced = f.prov === "LLM-SURFACED";
  const sevColor = f.sevColor || SEV[f.sev] || "#9397ab";

  const provBg = llmSurfaced ? "transparent" : "#3f424d";
  const provFg = llmSurfaced ? "#9397ab" : "#e4e7f5";
  const provBd = llmSurfaced ? "rgba(233,233,237,.22)" : "transparent";

  const DELTA_LABEL = {
    "under-rated": "under-rated by LLM", "over-rated": "over-rated by LLM",
    "agree": "agree", "unknown": "model gave no usable answer", "note-only": "note only"
  };
  const deltaLabel = DELTA_LABEL[f.delta] || (llmSurfaced ? "note only" : "—");
  const deltaBg = dis ? "rgba(226,128,127,.14)" : "transparent";
  const deltaFg = dis ? "#e2807f" : "#75798c";

  const chips = f.chips.length
    ? `<div class="chips">${f.chips.map((c) => `<span class="tagm">${esc(c.text)}</span>`).join("")}</div>`
    : "";

  return `
  <div class="row" data-row="${f.id}"
       style="background:${on ? "#232532" : "rgba(35,37,50,.42)"};
              box-shadow:${on ? "inset 0 0 0 1px #796cbf" : "inset 0 0 0 1px rgba(233,233,237,.08)"}">
    <div class="row-rail">
      <input type="checkbox" data-check="${f.id}" ${state.checked.includes(f.id) ? "checked" : ""}>
      <span class="row-sev" style="background:${sevColor}"></span>
    </div>
    <div class="row-main">
      <div class="row-head">
        <span class="sev-label" style="color:${sevColor}">${esc(f.sev)}</span>
        <span class="prov" style="background:${provBg};color:${provFg};border:1px solid ${provBd}">${esc(f.prov)}</span>
        <span class="stamp">${esc(f.time)}</span>
      </div>
      <div class="row-title">${esc(f.title)}</div>
      <div class="row-meta"><span>${esc(f.type)}</span><span class="sep">·</span>
        <span>${esc(f.host)}${f.hostDerived === false ? " (source IP)" : ""}</span></div>
      <div class="cmp">
        <div class="cmp-cell">
          <div class="cmp-k">Rule</div>
          <div class="cmp-v" style="font-weight:500;color:${llmSurfaced ? "var(--color-neutral-600)" : sevColor}">${
            llmSurfaced ? "no rule fired" : esc(f.ruleSev)}</div>
        </div>
        <div class="cmp-div"></div>
        ${llmSurfaced ? `
        <!-- Nothing to ablate: no rule fired, so there is no rule-vs-model contrast.
             The model IS the source here, so its own call is what belongs in this cell —
             not a blank dash implying it failed to produce one. -->
        <div class="cmp-cell">
          <div class="cmp-k">Model</div>
          <div class="cmp-v" style="color:${sevColor}">${esc(f.sev)}</div>
        </div>
        <div class="cmp-delta" style="background:transparent">
          <span style="color:var(--color-neutral-500)">model surfaced this</span>
        </div>` : DATA.compareRun ? `
        <div class="cmp-cell">
          <div class="cmp-k">LLM alone</div>
          <div class="cmp-v" style="color:${dis ? "#b2b6ca" : sevColor}">${esc(f.llmSev || "—")}</div>
        </div>
        <div class="cmp-delta" style="background:${deltaBg}">
          <span style="color:${deltaFg}">${deltaLabel}</span>
        </div>` : `
        <div class="cmp-cell">
          <div class="cmp-k">LLM alone</div>
          <div class="cmp-v" style="color:var(--color-neutral-600)">compare not run</div>
        </div>`}
      </div>
      ${chips}
    </div>
  </div>`;
}

/* Zero findings has three very different meanings. Only one of them is good news,
   and showing the green tick for the other two would report a false success. */
const isUnrecognized = () => DATA.live && DATA.unrecognized === true;
const isEmptyInput = () => DATA.live && DATA.emptyInput === true;

function emptyList() {
  if (isUnrecognized() || isEmptyInput()) return unrecognizedState();

  const clear = isClear();
  const body = DATA.live
    ? `${esc(DATA.runParsed)}, every rule evaluated, nothing crossed a threshold. `
      + `The run manifest above still records the input and detector hashes.`
    : "2,000 lines parsed, every rule evaluated, nothing crossed a threshold and the model "
      + "surfaced no below-threshold notes. The run manifest is still recorded and exportable.";
  return `
  <div class="empty">
    <div class="empty-mark">✓</div>
    <div class="empty-t">${clear ? "All clear — 0 anomalies" : "Nothing matches this filter"}</div>
    <div class="empty-b">${clear ? body : "Clear the filter to see the rest of this run's findings."}</div>
  </div>`;
}

/* Top-of-run warning. Shown whenever 0 lines parsed, however many findings the run
   happens to contain, because "we could not read this file" outranks anything below. */
function unrecognizedBanner() {
  const total = (DATA.linesParsed || 0) + (DATA.linesUnparsed || 0);
  const extra = DATA.findings.length
    ? ` This run still lists ${DATA.findings.length} item(s); they are not rule-backed and
        nothing here has been validated against a parsed log.`
    : "";
  return `
  <div class="warn">
    <span class="warn-bar"></span>
    <div>
      <div class="warn-t">${isEmptyInput()
        ? "Nothing to analyze — the input is empty"
        : `Log format not recognized — 0 of ${total.toLocaleString()} lines parsed`}</div>
      <div class="warn-b">No rule evaluated a single line, so this run is
        <strong>not</strong> evidence that the log is clean.${esc(extra)}</div>
    </div>
  </div>`;
}

/* Cautionary, never celebratory: nothing was analyzed, so nothing can be claimed. */
function unrecognizedState() {
  const empty = isEmptyInput();
  const total = (DATA.linesParsed || 0) + (DATA.linesUnparsed || 0);
  return `
  <div class="empty">
    <div class="empty-mark" style="border-color:#7a6a3c;color:#d8b45e">!</div>
    <div class="empty-t">${empty
      ? "Nothing to analyze — the input is empty"
      : `Log format not recognized — 0 of ${total.toLocaleString()} lines parsed`}</div>
    <div class="empty-b" style="max-width:420px">${empty
      ? "The file contains no log lines. No rules ran, so this is not an all-clear."
      : "Nothing was analyzed. The parser did not recognize this format, so no rule "
        + "evaluated a single line — this is <strong>not</strong> an all-clear. Every line is "
        + "counted as unparsed rather than dropped; add a parser for this format to analyze it."}</div>
  </div>`;
}

function detailPane(d) {
  if (!d) {
    const clear = isClear();          // derived from the data, not the demo switcher
    return `
    <section class="detail-pane">
      <div class="nodetail">
        <div class="nodetail-t">${
          isUnrecognized() || isEmptyInput() ? "Nothing was analyzed"
          : clear ? "No finding to review" : "Select a finding"}</div>
        <div class="nodetail-b">${
          isUnrecognized() || isEmptyInput()
            ? "No findings exist because nothing was parsed. Confirm the log format before "
              + "treating this run as evidence of anything."
          : clear
            ? "This run produced no anomalies. The run manifest above records the input and detector hashes for the audit trail."
            : "Pick a row on the left, or press j and k to move through the list."}</div>
      </div>
    </section>`;
  }

  const dis = underrated(d);
  const llmSurfaced = d.prov === "LLM-SURFACED";
  const sevColor = d.sevColor || SEV[d.sev] || "#9397ab";
  const mark = state.marks[d.id];

  const DELTA_HEAD = {
    "under-rated": "Rule overrode the model", "over-rated": "Model was more alarmed",
    "agree": "Rule and model agree", "unknown": "No usable answer from the model",
    "note-only": "Model note, no rule"
  };
  const deltaHead = DELTA_HEAD[d.delta] || (llmSurfaced ? "Model note, no rule" : "—");
  const deltaBody =
    d.delta === "under-rated"
      ? "The deterministic rule holds. Left to the model alone this would have been rated "
        + String(d.llmSev || "").toLowerCase() + " and likely gone unactioned."
    : d.delta === "over-rated"
      ? "The model rated this higher than the rule does. The rule's severity is still what stands."
    : d.delta === "unknown"
      ? "The model returned no usable output for these lines, so there is nothing to compare "
        + "against — this is an absence of evidence, not evidence the model missed it."
    : llmSurfaced
      ? "Below every rule threshold, so it carries no rule-backed severity. Shown as context only."
      : "Both landed on the same severity; the rule is still what sets it.";

  const evidence = d.lines.map((l) => `
    <div class="ev-row" style="background:${l.crit ? "rgba(226,128,127,.10)" : "transparent"}">
      <span class="ev-n">${esc(l.n)}</span>
      <span class="ev-t">${esc(l.a)}${l.hit ? `<span class="ev-hit"
        style="background:${l.crit ? "#e2807f" : "#b5abfc"}">${esc(l.hit)}</span>` : ""}${esc(l.b)}</span>
    </div>`).join("");

  const timeline = d.timeline.map((t) => `
    <div class="tl">
      <span class="tl-t">${esc(t.t)}</span>
      <span class="tl-rail"><span class="tl-dot" style="background:${t.dot}"></span><span class="tl-line"></span></span>
      <span class="tl-l">${esc(t.label)}</span>
    </div>`).join("");

  const markStatus = mark === "tp"
    ? "Marked true positive · " + state.reason.replace("Reason — ", "")
    : mark === "fp"
      ? "Dismissed false positive · " + state.reason.replace("Reason — ", "")
      : "Unreviewed";
  const markColor = mark === "tp" ? "#8ecf9a" : mark === "fp" ? "#9397ab" : "#75798c";

  return `
  <section class="detail-pane">
    <div class="detail">
      <div class="d-head">
        <span class="sev-label" style="color:${sevColor}">${esc(d.sev)}</span>
        <span class="prov" style="background:${llmSurfaced ? "transparent" : "#3f424d"};
              color:${llmSurfaced ? "#9397ab" : "#e4e7f5"};
              border:1px solid ${llmSurfaced ? "rgba(233,233,237,.22)" : "transparent"}">${esc(d.prov)}</span>
        <span class="d-type">${esc(d.type)}</span>
        <span class="stamp">${esc(d.stamp)}</span>
      </div>

      <h3 class="d-title">${esc(d.title)}</h3>

      <div class="verdicts">
        <div class="vcard" style="background:var(--color-surface);box-shadow:var(--shadow-sm)">
          <div class="vcard-k">Rule verdict · authoritative</div>
          <div class="vcard-v" style="font-weight:500;color:${
            llmSurfaced ? "var(--color-neutral-500)" : sevColor}">${
            llmSurfaced ? "no rule fired" : esc(d.ruleSev)}</div>
          <div class="vcard-s">${llmSurfaced
            ? "Nothing in the ruleset matched — this sits below every threshold."
            : esc(d.ruleWhy)}</div>
        </div>
        ${llmSurfaced ? `
        <!-- An LLM-surfaced finding has no rule to compare against, so the ablation
             cards would render two blanks. Show the model's own call and credit it
             for the catch: this is the below-threshold gap the model exists to cover,
             and the console should read as "each layer has a job". -->
        <div class="vcard" style="background:rgba(35,37,50,.5);box-shadow:inset 0 0 0 1px rgba(233,233,237,.10)">
          <div class="vcard-k">Model severity · the source of this finding</div>
          <div class="vcard-v" style="color:${sevColor}">${esc(d.sev)}</div>
          <div class="vcard-s">The model's own call on an event no rule covers.</div>
        </div>
        <div class="vcard" style="background:rgba(145,132,217,.10);
             box-shadow:inset 0 0 0 1px rgba(145,132,217,.32)">
          <div class="vcard-k">Outcome</div>
          <div class="vcard-v" style="font-weight:500;color:var(--color-accent)">Model surfaced this</div>
          <div class="vcard-s" style="color:var(--color-neutral-400);text-wrap:pretty">No rule fired
            — this sits below every rule threshold. The model flagged it as a
            ${esc(String(d.sev).toLowerCase())}-severity heads-up, which is exactly the gap it is
            there to cover.</div>
        </div>` : DATA.compareRun ? `
        <div class="vcard" style="background:rgba(35,37,50,.5);box-shadow:inset 0 0 0 1px rgba(233,233,237,.10)">
          <div class="vcard-k">LLM alone · explanatory only</div>
          <div class="vcard-v" style="color:${dis ? "#b2b6ca" : sevColor}">${esc(d.llmSev || "—")}</div>
          <div class="vcard-s">${esc(d.llmWhy || "")}</div>
        </div>
        <div class="vcard" style="background:${dis ? "rgba(226,128,127,.10)" : "rgba(35,37,50,.5)"};
             box-shadow:inset 0 0 0 1px ${dis ? "rgba(226,128,127,.35)" : "rgba(233,233,237,.10)"}">
          <div class="vcard-k">Outcome</div>
          <div class="vcard-v" style="font-weight:500;color:${dis ? "#e2807f" : "#b2b6ca"}">${deltaHead}</div>
          <div class="vcard-s" style="color:var(--color-neutral-400);text-wrap:pretty">${deltaBody}</div>
        </div>` : `
        <div class="vcard" style="background:rgba(35,37,50,.5);box-shadow:inset 0 0 0 1px rgba(233,233,237,.10)">
          <div class="vcard-k">LLM alone · not measured</div>
          <div class="vcard-v" style="color:var(--color-neutral-600);font-size:15px">compare not run</div>
          <div class="vcard-s">Re-run the analyzer with <code>--compare</code> to record what this
            model rates the same events with no rules and no pre-flags.</div>
        </div>`}
      </div>

      <div class="panel explain">
        <div class="panel-k">Plain-language explanation · llama3.1:8b, local</div>
        ${d.explanation ? `<p>${esc(d.explanation)}</p>` : (
          state.explaining === d.id
            ? `<p style="color:var(--color-neutral-500)">generating an explanation for this
                 finding… the rule verdict, evidence and timeline above are already final.</p>`
            : STANDALONE
              ? `<p style="color:var(--color-neutral-500)">Explanation available in the
                   interactive app — this static export carries only the explanations that
                   were generated when the run was exported. Everything above (severity,
                   evidence, rule, timeline) is complete.</p>`
              : `<p style="color:var(--color-neutral-500)">Explanation pending — only the most
                 severe findings are explained up front, so a large log stays fast.
                 <button class="btn btn-primary" style="margin-left:var(--space-2)"
                   data-act="explain">Explain this finding</button></p>`)}
      </div>

      <div class="ev-head">
        <h5>Evidence</h5>
        <span>${d.linesNote
          ? esc(d.linesNote)
          : "verbatim from the source log — nothing generated"}</span>
        <button class="btn btn-secondary" style="margin-left:auto" data-act="copy">${
          state.copied ? "Evidence block copied" : "Copy evidence block"}</button>
      </div>
      <div class="ev">${evidence}</div>

      <div class="split">
        <div class="panel">
          <div class="panel-k">Rule predicate that fired</div>
          <div class="pred">${esc(d.predicate)}</div>
          <div class="pred-ref">${esc(d.ruleRef)}</div>
        </div>
        <div class="panel">
          <div class="panel-k">Event sequence</div>
          ${timeline}
        </div>
      </div>

      <div class="panel">
        <div class="mark-head">
          <div class="panel-k" style="margin:0">Analyst mark</div>
          <span class="note">read-only tool · this records your judgement, it changes nothing on the hosts</span>
          <span class="status" style="color:${markColor}">${esc(markStatus)}</span>
        </div>
        <div class="mark-acts">
          <button class="btn btn-primary" data-act="tp">Confirm — true positive</button>
          <button class="btn btn-secondary" data-act="fp">Dismiss — false positive</button>
          <select class="input" data-act="reason">
            ${REASONS.map((r) => `<option ${r === state.reason ? "selected" : ""}>${esc(r)}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>
  </section>`;
}

/* Saved runs. Results outlive the page and the server process, so a refresh — or a
   restart, or coming back tomorrow — reopens what was already analyzed instead of
   asking for another multi-minute run. */
function runsPanel() {
  const runs = state.runs || [];
  if (!runs.length) return `<div class="runs"><div class="runs-k">No saved runs yet</div></div>`;
  return `<div class="runs">
    <div class="runs-k">Saved runs — click to reopen</div>
    ${runs.map((r) => `
      <button class="run" data-run="${esc(r.file)}" data-current="${
        r.runId === DATA.runId ? 1 : 0}">
        <b>${esc(r.runId)}</b>
        <span>${r.unrecognized ? "unrecognized" : `${r.findings} finding(s)`}${
          r.compareRun ? " · compare" : ""}</span>
        <span class="when">${esc((r.generatedAt || "").slice(5, 16).replace("T", " "))}</span>
      </button>`).join("")}
  </div>`;
}

function footer() {
  const m = DATA.manifest || {};
  const short = (h) => (h ? String(h).slice(0, 8) : "—");
  return `
  <footer class="ftr">
    <span class="local"><i></i>${localPillText()}</span>
    <span>model ${esc(m.model || "—")}</span>
    <span>ruleset ${esc(m.ruleset || "—")}</span>
    <span>detector ${esc(short(m.detector_sha256))}</span>
    <span class="ro">read-only · no automated actions</span>
  </footer>`;
}

// --------------------------------------------------------------------------
// Behaviour
// --------------------------------------------------------------------------
function setState(patch) { Object.assign(state, patch); render(); }

/* Explanations are generated on demand for all but the most severe findings, so
   opening one asks for its prose. Everything deterministic is already on screen. */
async function explainCurrent() {
  if (STANDALONE) return;          // no server to ask
  const d = current();
  if (!d || d.explanation || state.explaining === d.id) return;
  state.explaining = d.id;
  render();
  try {
    const res = await fetch("/api/explain", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: d.id }),
    });
    const out = await res.json();
    if (out && out.explanation) d.explanation = out.explanation;
    else state.error = (out && out.error) || null;
  } catch { /* leave it pending; the button can be pressed again */ }
  state.explaining = null;
  render();
}

function toggleCheck(id) {
  setState({ checked: state.checked.includes(id)
    ? state.checked.filter((x) => x !== id)
    : state.checked.concat(id) });
}

function mark(id, v) {
  setState({ marks: Object.assign({}, state.marks, { [id]: v }) });
}

function copyEvidence() {
  const d = current();
  if (d && navigator.clipboard) {
    navigator.clipboard.writeText([
      d.title, "",
      d.lines.map((l) => l.n + "  " + l.a + l.hit + l.b).join("\n"), "",
      d.predicate, "", d.ruleRef
    ].join("\n")).catch(() => {});
  }
  setState({ copied: true });
}

/* ---- picker actions ------------------------------------------------------ */

function readControls() {
  const cmp = document.getElementById("cmpInput");
  if (cmp) state.compare = cmp.checked;
  const url = document.getElementById("urlInput");
  if (url) state.urlValue = url.value;
  const mode = document.querySelector("input[name='computeMode']:checked");
  if (mode) {
    state.computeCfg = {
      mode: mode.value,
      baseUrl: (document.getElementById("computeUrl") || {}).value || "",
      apiKey: (document.getElementById("computeKey") || {}).value || "",
      model: (document.getElementById("computeModel") || {}).value || "",
    };
  }
}

/* The analyzer runs for minutes on a large log, so /api/analyze returns 202 and we
   poll /api/progress. A blocking request would leave the page frozen with nothing
   to show — which is indistinguishable from a crash. */
async function analyze(body, label, isForm) {
  readControls();
  // The compute choice must be on the server BEFORE analysis starts: rules-only
  // vs local-model runs are decided there. An invalid remote URL stops here —
  // silently falling back to local would disrespect an explicit choice.
  try {
    const cres = await fetch("/api/compute", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state.computeCfg || { mode: "local" }),
    });
    if (!cres.ok) {
      const d = await cres.json().catch(() => ({}));
      state.error = d.error || "invalid remote compute settings";
      return render();
    }
  } catch { /* server unreachable — the analyze call below reports it */ }
  state.busy = true; state.busyLabel = label; state.busyCompare = state.compare;
  state.progress = null; state.error = null;
  render();
  try {
    const res = await fetch("/api/analyze", isForm
      ? { method: "POST", body }
      : { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...body, compare: state.compare }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok && res.status !== 202) {
      state.busy = false;
      state.error = data.error || `analysis failed (HTTP ${res.status})`;
      return render();
    }
    pollProgress();
  } catch (err) {
    state.busy = false;
    state.error = `could not reach the console server: ${err.message}`;
    render();
  }
}

function pollProgress() {
  clearInterval(state.pollTimer);
  state.pollTimer = setInterval(async () => {
    let job;
    try {
      job = await (await fetch("/api/progress", { cache: "no-store" })).json();
    } catch { return; }                      // transient; keep polling

    if (job.status === "running") {
      state.progress = job;
      return render();
    }
    clearInterval(state.pollTimer);
    state.busy = false;
    if (job.status === "error") {
      state.error = job.error || "analysis failed";
      return render();
    }
    const data = await (await fetch(`./console_state.json?t=${Date.now()}`,
                                    { cache: "no-store" })).json();
    DATA = data;
    state.selId = null;
    loadRuns().then(render);
    render();
  }, 900);
}

function newAnalysis() {
  if (STANDALONE) return;
  fetch("/api/reset", { method: "POST" }).catch(() => {});
  DATA = { idle: true, live: true, findings: [] };
  state.error = null;
  loadSources().then(render);
  loadRuns().then(render);
  render();
}

function loadRuns() {
  if (STANDALONE) return Promise.resolve();
  return fetch("/api/runs", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => { if (d) state.runs = d.runs; })
    .catch(() => {});
}

async function openRun(file) {
  if (STANDALONE) return;
  state.showRuns = false;
  try {
    const res = await fetch("/api/open", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file }),
    });
    const data = await res.json();
    if (data && Array.isArray(data.findings)) {
      DATA = data;
      state.selId = null;
    }
  } catch { /* keep whatever is on screen */ }
  render();
}

function loadSources() {
  if (STANDALONE) return Promise.resolve();
  return fetch("/api/sources", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((s) => { if (s) state.sources = s; })
    .catch(() => {});
}

document.addEventListener("click", (e) => {
  const t = e.target;

  const runBtn = t.closest("[data-run]");
  if (runBtn) return openRun(runBtn.dataset.run);

  // Any click outside the panel closes it.
  if (state.showRuns && !t.closest(".navbtn")) {
    state.showRuns = false;
    render();
  }

  const sample = t.closest("[data-sample]");
  if (sample) return analyze({ source: "sample", value: sample.dataset.sample },
                             sample.dataset.sample, false);

  const suggest = t.closest("[data-suggest]");
  if (suggest) {
    const input = document.getElementById("urlInput");
    if (input) input.value = suggest.dataset.suggest;
    state.urlValue = suggest.dataset.suggest;
    return;
  }

  const check = t.closest("[data-check]");
  if (check) { e.stopPropagation(); toggleCheck(check.dataset.check); return; }

  const filter = t.closest("[data-filter]");
  if (filter) { setState({ filter: filter.dataset.filter }); return; }

  const act = t.closest("[data-act]");
  if (act) {
    switch (act.dataset.act) {
      case "download": return (window.location = "/api/export");
      case "runs": return setState({ showRuns: !state.showRuns });
      case "new": return newAnalysis();
      case "explain": return explainCurrent();
      case "upload": {
        readControls();
        const input = document.getElementById("fileInput");
        const file = input && input.files && input.files[0];
        if (!file) { state.error = "Choose a file first."; return render(); }
        const form = new FormData();
        form.append("file", file);
        form.append("compare", state.compare ? "1" : "0");
        return analyze(form, file.name, true);
      }
      case "fetch": {
        readControls();
        if (!state.urlValue.trim()) { state.error = "Paste a URL first."; return render(); }
        return analyze({ source: "url", value: state.urlValue.trim() },
                       state.urlValue.trim(), false);
      }
      case "manifest": return setState({ manifest: !state.manifest });
      case "print": return window.print();
      case "copy": return copyEvidence();
      case "tp": { const d = current(); return d && mark(d.id, "tp"); }
      case "fp": { const d = current(); return d && mark(d.id, "fp"); }
      case "bulk-confirm": {
        const m = Object.assign({}, state.marks);
        state.checked.forEach((id) => { m[id] = "tp"; });
        return setState({ marks: m, checked: [] });
      }
      case "bulk-clear": return setState({ checked: [] });
      default: return;           // noop
    }
  }

  const row = t.closest("[data-row]");
  if (row) {
    setState({ selId: row.dataset.row, copied: false });
    if (DATA.live && !current()?.explanation) explainCurrent();
  }
});

document.addEventListener("change", (e) => {
  const view = e.target.closest("[data-view]");
  if (view) return setState({ view: view.dataset.view, selId: "f1" });
  if (e.target.matches('[data-act="reason"]')) return setState({ reason: e.target.value });
});

/* j/k to move, x to select, e to mark reviewed — the shortcuts the list
   advertises. Ignored while typing in a field. */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;

  const list = visible();
  if (!list.length) return;
  const i = Math.max(0, list.findIndex((f) => f.id === (current() || {}).id));

  if (e.key === "j") { e.preventDefault(); setState({ selId: list[Math.min(i + 1, list.length - 1)].id, copied: false }); }
  if (e.key === "k") { e.preventDefault(); setState({ selId: list[Math.max(i - 1, 0)].id, copied: false }); }
  if (e.key === "x") { e.preventDefault(); toggleCheck(list[i].id); }
  if (e.key === "e") { e.preventDefault(); mark(list[i].id, "tp"); }
});

/* Data bootstrap, in order of directness:
     1. window.CONSOLE_DATA — injected by console/serve.py
     2. ./console_state.json — adapter output sitting next to this file
     3. the bundled fixture — so the file always opens, even with no run
   The console never fetches anything off this machine; over file:// the fetch
   fails by design and the fixture is used. */
function boot() {
  if (window.CONSOLE_DATA) {
    DATA = window.CONSOLE_DATA;
    render();
    return;
  }
  render();                                   // fixture first, so it never blanks
  // Cache-busted: re-running serve.py replaces the run at the same URL, and a
  // refresh that served a cached state would silently show the previous run.
  fetch(`./console_state.json?t=${Date.now()}`, { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (!data) return;
      loadRuns().then(render);
      if (data.idle) {                        // served by the app with no run yet
        DATA = { idle: true, live: true, findings: [] };
        return loadSources().then(render);
      }
      if (Array.isArray(data.findings)) {
        DATA = data;
        state.selId = null;
        render();
      }
    })
    .catch(() => {});                          // file:// or no server — keep the fixture
}

boot();
</script>
</body>
</html>
