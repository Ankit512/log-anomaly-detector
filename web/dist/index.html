    <script>
      // Apply the saved/OS theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("itsoc-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) { /* no storage: stay light */ }
    </script>
